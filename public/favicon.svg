<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background Warm Ivory Paper -->
  <rect width="512" height="512" rx="128" fill="#FAF6EE" />
  
  <!-- Outer Gold Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#C5A880" stroke-width="8" stroke-dasharray="16, 8" opacity="0.6" />
  <rect x="28" y="28" width="456" height="456" rx="100" fill="none" stroke="#C5A880" stroke-width="2" />

  <!-- Elegant Halo / Ring of Light -->
  <circle cx="256" cy="200" r="80" fill="none" stroke="#C5A880" stroke-width="12" stroke-opacity="0.4" />
  <circle cx="256" cy="200" r="80" fill="none" stroke="#9E7E40" stroke-width="2" />
  
  <!-- Latin Cross -->
  <g fill="#9E7E40" stroke="#C5A880" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- Vertical Bar -->
    <path d="M 236 70 L 276 70 L 276 430 L 236 430 Z" />
    <!-- Horizontal Bar -->
    <path d="M 140 180 L 372 180 L 372 220 L 140 220 Z" />
    
    <!-- Decorative Center Diamond -->
    <path d="M 256 175 L 281 200 L 256 225 L 231 200 Z" fill="#C5A880" stroke="#FAF6EE" stroke-width="3" />
  </g>

  <!-- Ornaments in Corners -->
  <g fill="#9E7E40" opacity="0.7">
    <!-- Top-Left -->
    <path d="M 64 84 L 84 64 M 64 64 L 74 64 L 64 74 Z" stroke="#9E7E40" stroke-width="4" />
    <!-- Top-Right -->
    <path d="M 448 84 L 428 64 M 448 64 L 438 64 L 448 74 Z" stroke="#9E7E40" stroke-width="4" />
    <!-- Bottom-Left -->
    <path d="M 64 428 L 84 448 M 64 448 L 74 448 L 64 438 Z" stroke="#9E7E40" stroke-width="4" />
    <!-- Bottom-Right -->
    <path d="M 448 428 L 428 448 M 448 448 L 438 448 L 448 438 Z" stroke="#9E7E40" stroke-width="4" />
  </g>
</svg>