<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#2A2218" />
      <stop offset="100%" stop-color="#14110D" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE494" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <g transform="translate(256 256) scale(15)">
    <!-- Wheat Stalk Stem -->
    <path d="M0 -12 V12" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" />
    <!-- Center Grains -->
    <path d="M0 -11 C-2.5 -9 -2.5 -6 0 -4 C2.5 -6 2.5 -9 0 -11 Z" fill="url(#goldGrad)" />
    <path d="M0 -7 C-3 -5 -3 -2 0 0 C3 -2 3 -5 0 -7 Z" fill="url(#goldGrad)" />
    <path d="M0 -3 C-3.2 -1 -3.2 2 0 4 C3.2 2 3.2 -1 0 -3 Z" fill="url(#goldGrad)" />
    <path d="M0 1 C-3.2 3 -3.2 6 0 8 C3.2 6 3.2 3 0 1 Z" fill="url(#goldGrad)" />
    <!-- Left Leaves/Grains -->
    <path d="M-0.6 -5.5 C-4 -6 -6 -3.5 -3.5 -1.5 C-1.5 -1.5 -0.6 -3.5 -0.6 -5.5 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M-0.6 -1.5 C-4.5 -2 -6.5 0.5 -4 2.5 C-2 2.5 -0.6 0.5 -0.6 -1.5 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M-0.6 2.5 C-5 2 -7 4.5 -4.5 6.5 C-2.5 6.5 -0.6 4.5 -0.6 2.5 Z" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Right Leaves/Grains -->
    <path d="M0.6 -5.5 C4 -6 6 -3.5 3.5 -1.5 C1.5 -1.5 0.6 -3.5 0.6 -5.5 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M0.6 -1.5 C4.5 -2 6.5 0.5 4 2.5 C2 2.5 0.6 0.5 0.6 -1.5 Z" fill="url(#goldGrad)" opacity="0.9" />
    <path d="M0.6 2.5 C5 2 7 4.5 4.5 6.5 C2.5 6.5 0.6 4.5 0.6 2.5 Z" fill="url(#goldGrad)" opacity="0.9" />
    <!-- Bottom Flourishing Leaves -->
    <path d="M0 6 C-6 5 -9 10 -6 13 C-3 12 0 9 0 6 Z" fill="url(#goldGrad)" />
    <path d="M0 6 C6 5 9 10 6 13 C3 12 0 9 0 6 Z" fill="url(#goldGrad)" />
  </g>
