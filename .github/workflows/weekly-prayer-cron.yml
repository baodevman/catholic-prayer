name: Weekly Prayer Crawl & Prismic Sync Cron

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  crawl-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Prayer Crawl & Prismic Sync with AI Classifier
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRISMIC_REPO: ${{ secrets.PRISMIC_REPO }}
          PRISMIC_WRITE_TOKEN: ${{ secrets.PRISMIC_WRITE_TOKEN }}
          PRISMIC_ACCESS_TOKEN: ${{ secrets.PRISMIC_ACCESS_TOKEN }}
        run: npm run cron:crawl-and-sync

      - name: Commit and Push Updated Prayers Dataset
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chrono: Tự động cào & phân loại lời cầu nguyện Công giáo hàng tuần"
          file_pattern: "import-prayers.json public/prayers.json"
